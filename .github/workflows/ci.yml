name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with PostgreSQL (Dev Services)
        run: mvn -B verify

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install webui dependencies
        run: cd webui && npm ci

      - name: Start Quarkus backend
        run: ./mvnw quarkus:dev -DskipTests -Dquarkus.analytics.disabled=true -Dquarkus.dev-ui.disabled=true -Dquarkus.live-reload.enabled=false -Dquarkus.test.continuous-testing.enabled=false &
        env:
          MAVEN_OPTS: -Xmx1g

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health; then
              echo "Backend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start"
          exit 1

      - name: Install Playwright browsers
        run: cd webui && npx playwright install chromium

      - name: Run E2E tests
        run: cd webui && npm run test:e2e

      - name: Stop Quarkus backend
        if: always()
        run: |
          pkill -f "quarkus:dev" || true
          sleep 2

  crap-analysis:
    name: CRAP Analysis
    runs-on: ubuntu-latest
    needs: e2e-test
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run CRAP metrics analysis
        run: mvn -B verify -Pcrap

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload JaCoCo report for Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-for-pages
          path: target/site/jacoco/
          retention-days: 1

  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    needs: crap-analysis
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Restore PITest history cache
        uses: actions/cache@v4
        with:
          path: target/pit-history.zip
          key: pitest-history-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            pitest-history-${{ github.ref }}-

      - name: Run PITest mutation testing
        run: mvn -B verify org.pitest:pitest-maven:mutationCoverage
        env:
          MAVEN_OPTS: -Xmx4g -Dpitest.threads=2

      - name: Save PITest history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/pit-history.zip
          key: pitest-history-${{ github.ref }}-${{ github.sha }}

      - name: Upload mutation test report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-report
          path: target/pit-reports/
          retention-days: 14

      - name: Upload mutation report for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-for-pages
          path: target/pit-reports/
          retention-days: 1

  docker-jvm:
    name: Docker JVM
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: mutation-test
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: mvn -B package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push JVM image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-native:
    name: Docker Native
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: mutation-test
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache GraalVM
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/graalvm
          key: ${{ runner.os }}-graalvm-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-graalvm-

      - name: Build native image
        run: mvn -B package -Dnative -Dquarkus.native.container-build=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-native
            type=sha,prefix=sha-,suffix=-native

      - name: Build and push native image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages-deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker-jvm, docker-native]
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-for-pages
          path: pages/jacoco

      - name: Download mutation report
        uses: actions/download-artifact@v4
        with:
          name: mutation-for-pages
          path: pages/mutation

      - name: Prepare Pages site
        run: cp README.md pages/index.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: true
