quarkus.http.port=8080

# Use random port in test mode to avoid conflicts with dev mode
%test.quarkus.http.port=0

# No cache for index.html so new builds are picked up immediately
quarkus.http.static-assets.cache-seconds=0

# Database - PostgreSQL (Dev Services provides container for dev/test)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.log.sql=false

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/changelog-master.yaml
%test.quarkus.log.category."io.quarkus.config".level=ERROR

quarkus.websockets-next.server.supported-subprotocols=ocpp1.6

# WebSocket keepalive
ocpp.websocket.ping-interval-seconds=30
ocpp.websocket.pong-timeout-seconds=360
ocpp.heartbeat.interval-seconds=300

# Health Checks - SmallRye Health
quarkus.smallrye-health.root-path=/health

# Metrics - Prometheus
quarkus.micrometer.export.prometheus.path=/metrics

# OpenAPI
mp.openapi.extensions.smallrye.info.title=OCPP 1.6J Central System API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Charge Point Central System REST API
quarkus.smallrye-openapi.path=/openapi

# SSHD logging (SFTP disabled by default - many charge points only support FTP)
quarkus.log.category."org.apache.sshd".level=WARN

# Diagnostics Upload
ocpp.diagnostics.upload-dir=/tmp/ocpp-diagnostics
ocpp.diagnostics.max-file-size-bytes=104857600
ocpp.diagnostics.retention-days=30
ocpp.diagnostics.preferred-protocol=ftp
ocpp.diagnostics.public-host=${OCPP_FTP_EXTERNAL_ADDRESS:127.0.0.1}

# SFTP Server
ocpp.sftp.enabled=true
ocpp.sftp.port=2022
ocpp.sftp.host=0.0.0.0
ocpp.sftp.username=ocpp
ocpp.sftp.password=ocpp

# FTP Server
ocpp.ftp.enabled=true
ocpp.ftp.port=2021
ocpp.ftp.host=0.0.0.0
ocpp.ftp.username=ocpp
ocpp.ftp.password=ocpp
ocpp.ftp.passive-ports=30000-30100
