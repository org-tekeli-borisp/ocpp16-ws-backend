<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_commands">OCPP Remote Commands</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9; color: #1a1a2e; min-height: 100vh;
}
header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 1.4rem; font-weight: 600; }
header a { color: #8ab4f8; text-decoration: none; font-size: .85rem; }
header a:hover { text-decoration: underline; }
.lang-select {
    background: transparent; color: #8ab4f8; border: 1px solid rgba(138,180,248,.3);
    border-radius: 4px; padding: .2rem .4rem; font-size: .8rem; cursor: pointer;
    margin-left: .5rem;
}
.lang-select:hover { background: rgba(255,255,255,.1); }
.lang-select option { color: #1a1a2e; background: #fff; }
.header-right { display: flex; align-items: center; }
.container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
@media (max-width: 800px) { .container { grid-template-columns: 1fr; } }

.panel {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
}
.panel h2 {
    font-size: .9rem; text-transform: uppercase; letter-spacing: .05em;
    padding: 1rem 1.2rem; background: #f8f9fa; border-bottom: 1px solid #eee;
    color: #495057; font-weight: 600;
}
.panel-body { padding: 1.2rem; }

.form-group { margin-bottom: 1rem; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
    display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; color: #495057;
}
.form-group label .required { color: #dc3545; margin-left: 2px; }
.form-group label .optional { color: #6c757d; font-weight: 400; font-size: .75rem; }
.form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: .55rem .75rem; border: 1px solid #ced4da; border-radius: 6px;
    font-size: .88rem; font-family: inherit; transition: border-color .15s; background: #fff;
}
.form-group textarea { min-height: 80px; resize: vertical; font-family: "SFMono-Regular", Consolas, monospace; font-size: .82rem; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74, 158, 255, .15);
}
.form-group .hint { font-size: .75rem; color: #6c757d; margin-top: .25rem; }
select:invalid { color: #6c757d; }

.btn {
    padding: .6rem 1.5rem; border: none; border-radius: 6px; font-size: .88rem;
    font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: .4rem;
}
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
.btn-sm { padding: .4rem .8rem; font-size: .8rem; }
.btn-outline { background: transparent; border: 1px solid #ced4da; color: #495057; }
.btn-outline:hover { background: #f8f9fa; }

.station-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: .7rem 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background .1s;
}
.station-item:last-child { border-bottom: none; }
.station-item:hover { background: #f8f9ff; margin: 0 -1.2rem; padding-left: 1.2rem; padding-right: 1.2rem; }
.station-item.active { background: #e8f0fe; margin: 0 -1.2rem; padding-left: 1.2rem; padding-right: 1.2rem; border-radius: 6px; }
.station-name { font-weight: 600; font-size: .9rem; }
.station-meta { font-size: .78rem; color: #6c757d; margin-top: .15rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: .4rem; }
.status-dot.online { background: #28a745; }
.status-dot.offline { background: #dc3545; }
.connector-list { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .8rem; padding-top: .8rem; border-top: 1px solid #eee; margin-bottom: 1rem; }
.connector-list-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; font-weight: 600; width: 100%; margin-bottom: .2rem; }
.connector-chip {
    display: inline-flex; align-items: center; gap: .2rem;
    padding: .15rem .45rem; border-radius: 4px;
    font-size: .7rem; font-weight: 600; white-space: nowrap;
}
.connector-chip .cid { color: #6c757d; font-weight: 400; margin-right: .15rem; }
.connector-chip.avail { background: #d4edda; color: #155724; }
.connector-chip.charg { background: #cce5ff; color: #004085; }
.connector-chip.fault { background: #f8d7da; color: #721c24; }
.connector-chip.other { background: #fff3cd; color: #856404; }
.connector-chip.unavail { background: #e2e3e5; color: #383d41; }

.response-area {
    background: #1a1a2e; color: #e8e8e8; border-radius: 8px; padding: 1rem;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: .8rem; max-height: 400px; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
}
.response-area .empty { color: #6c757d; font-style: italic; }
.response-area .success { color: #28a745; }
.response-area .error { color: #f85149; }
.response-info { font-size: .78rem; color: #6c757d; margin-bottom: .5rem; }
</style>
</head>
<body>
<header>
    <h1 class="header-title" data-i18n="page_commands">OCPP Remote Commands</h1>
    <div class="header-right">
        <a href="/stations.html" data-i18n="nav_stations">Stationen</a>
        <select id="langSelect" class="lang-select">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
        </select>
    </div>
</header>
<div class="container">
    <div class="panel">
        <h2 data-i18n="select_station">Station auswählen</h2>
        <div class="panel-body" id="stationsPanel">
            <p class="loading" style="color:#6c757d;font-size:.85rem;" data-i18n="loading_stations">Lade Stationen…</p>
        </div>
    </div>
    <div>
        <div class="panel" style="margin-bottom:1.5rem;">
            <h2 data-i18n="label_command">Kommando</h2>
            <div class="panel-body">
                <div id="connectorStatus"></div>
                <div class="form-group">
                    <label data-i18n="label_command">Kommando</label>
                    <select id="cmdSelect" disabled required>
                        <option value="" data-i18n="select_command_first">– zuerst Station wählen –</option>
                    </select>
                </div>
                <div id="commandForm"></div>
                <div style="margin-top:1rem;">
                    <button class="btn btn-primary" id="sendBtn" disabled onclick="sendCommand()" data-i18n="btn_send">Senden</button>
                </div>
            </div>
        </div>
        <div class="panel">
            <h2 data-i18n="response_label">Antwort</h2>
            <div class="panel-body">
                <div class="response-info" id="responseInfo"></div>
                <div class="response-area" id="responseArea"><span class="empty" data-i18n="no_response_yet">Noch keine Antwort</span></div>
            </div>
        </div>
    </div>
</div>

<script src="/i18n.js"></script>
<script>
const API_BASE = '/api/chargepoints';

let selectedChargePointId = null;
let commandsCache = {};

const CMD_DEFS = {
    'reset': {
        labelKey: 'cmd_reset',
        fields: [
            { name: 'type', labelKey: 'field_type', type: 'select', required: true, options: ['Hard', 'Soft'] }
        ]
    },
    'clear-cache': {
        labelKey: 'cmd_clear_cache',
        fields: []
    },
    'get-local-list-version': {
        labelKey: 'cmd_get_local_list_version',
        fields: []
    },
    'unlock-connector': {
        labelKey: 'cmd_unlock_connector',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true }
        ]
    },
    'remote-start-transaction': {
        labelKey: 'cmd_remote_start_transaction',
        fields: [
            { name: 'idTag', labelKey: 'field_id_tag', type: 'text', required: true },
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true }
        ]
    },
    'remote-stop-transaction': {
        labelKey: 'cmd_remote_stop_transaction',
        fields: [
            { name: 'transactionId', labelKey: 'field_transaction_id', type: 'number', required: true }
        ]
    },
    'change-availability': {
        labelKey: 'cmd_change_availability',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true },
            { name: 'type', labelKey: 'field_type', type: 'select', required: true, options: ['Inoperative', 'Operative'] }
        ]
    },
    'change-configuration': {
        labelKey: 'cmd_change_configuration',
        fields: [
            { name: 'key', labelKey: 'field_key', type: 'text', required: true },
            { name: 'value', labelKey: 'field_value', type: 'text', required: true }
        ]
    },
    'trigger-message': {
        labelKey: 'cmd_trigger_message',
        fields: [
            { name: 'requestedMessage', labelKey: 'field_requested_message', type: 'select', required: true,
              options: ['BootNotification', 'DiagnosticsStatusNotification', 'FirmwareStatusNotification',
                        'Heartbeat', 'MeterValues', 'StatusNotification', 'LogStatusNotification',
                        'SignChargePointCertificate'] },
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: false }
        ]
    },
    'extended-trigger-message': {
        labelKey: 'cmd_extended_trigger_message',
        fields: [
            { name: 'requestedMessage', labelKey: 'field_requested_message', type: 'select', required: true,
              options: ['BootNotification', 'LogStatusNotification', 'FirmwareStatusNotification',
                        'Heartbeat', 'MeterValues', 'SignChargePointCertificate', 'StatusNotification'] },
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: false }
        ]
    },
    'cancel-reservation': {
        labelKey: 'cmd_cancel_reservation',
        fields: [
            { name: 'reservationId', labelKey: 'field_reservation_id', type: 'number', required: true }
        ]
    },
    'get-composite-schedule': {
        labelKey: 'cmd_get_composite_schedule',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true },
            { name: 'duration', labelKey: 'field_duration', type: 'number', required: true }
        ]
    },
    'get-configuration': {
        labelKey: 'cmd_get_configuration',
        fields: [
            { name: 'key', labelKey: 'field_keys_hint', type: 'text', required: false }
        ]
    },
    'get-diagnostics': {
        labelKey: 'cmd_get_diagnostics',
        fields: [
            { name: 'location', labelKey: 'field_upload_url', type: 'text', required: true }
        ]
    },
    'reserve-now': {
        labelKey: 'cmd_reserve_now',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true },
            { name: 'reservationId', labelKey: 'field_reservation_id', type: 'number', required: true },
            { name: 'expiryDate', labelKey: 'field_expiry_date', type: 'text', required: true },
            { name: 'idTag', labelKey: 'field_id_tag', type: 'text', required: true }
        ]
    },
    'send-local-list': {
        labelKey: 'cmd_send_local_list',
        fields: [
            { name: 'listVersion', labelKey: 'field_list_version', type: 'number', required: true },
            { name: 'updateType', labelKey: 'field_update_type', type: 'select', required: true, options: ['Differential', 'Full'] }
        ]
    },
    'update-firmware': {
        labelKey: 'cmd_update_firmware',
        fields: [
            { name: 'location', labelKey: 'field_firmware_url', type: 'text', required: true },
            { name: 'retrieveDate', labelKey: 'field_retrieve_date', type: 'text', required: true }
        ]
    },
    'clear-charging-profile': {
        labelKey: 'cmd_clear_charging_profile',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: false },
            { name: 'stackLevel', labelKey: 'field_stack_level', type: 'number', required: false }
        ]
    },
    'get-installed-certificate-ids': {
        labelKey: 'cmd_get_installed_cert_ids',
        fields: [
            { name: 'certificateType', labelKey: 'field_cert_type', type: 'select', required: true,
              options: ['CentralSystemRootCertificate', 'ManufacturerRootCertificate'] }
        ]
    },
    'install-certificate': {
        labelKey: 'cmd_install_certificate',
        fields: [
            { name: 'certificateType', labelKey: 'field_cert_type', type: 'select', required: true,
              options: ['CentralSystemRootCertificate', 'ManufacturerRootCertificate'] },
            { name: 'certificate', labelKey: 'field_certificate_pem', type: 'textarea', required: true,
              hintKey: 'field_cert_max' }
        ]
    },
    'delete-certificate': {
        labelKey: 'cmd_delete_certificate',
        fields: [
            { name: 'certificateHashData', labelKey: 'field_cert_hash', type: 'json', required: true,
              hintKey: 'field_cert_hash_hint' }
        ]
    },
    'get-log': {
        labelKey: 'cmd_get_log',
        fields: [
            { name: 'logType', labelKey: 'field_log_type', type: 'select', required: true,
              options: ['DiagnosticsLog', 'SecurityLog'] },
            { name: 'requestId', labelKey: 'field_request_id', type: 'number', required: true },
            { name: 'log', labelKey: 'field_log_params', type: 'json', required: true,
              hintKey: 'field_log_hint' },
            { name: 'retries', labelKey: 'field_retries', type: 'number', required: false },
            { name: 'retryInterval', labelKey: 'field_retry_interval', type: 'number', required: false }
        ]
    },
    'set-charging-profile': {
        labelKey: 'cmd_set_charging_profile',
        fields: [
            { name: 'connectorId', labelKey: 'field_connector_id', type: 'number', required: true },
            { name: 'csChargingProfiles', labelKey: 'field_charging_profile', type: 'json', required: true,
              hintKey: 'field_charging_profile_hint' }
        ]
    },
    'signed-update-firmware': {
        labelKey: 'cmd_signed_update_firmware',
        fields: [
            { name: 'requestId', labelKey: 'field_request_id', type: 'number', required: true },
            { name: 'firmware', labelKey: 'field_firmware_json', type: 'json', required: true,
              hintKey: 'field_firmware_json_hint' },
            { name: 'retries', labelKey: 'field_retries', type: 'number', required: false },
            { name: 'retryInterval', labelKey: 'field_retry_interval', type: 'number', required: false }
        ]
    }
};

async function loadStations() {
    const panel = document.getElementById('stationsPanel');
    try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderStations(data);
        await fetchAllCommands(data.map(cp => cp.chargePointId));
    } catch (err) {
        panel.innerHTML = `<p style="color:#dc3545;">${I18N.t('error_loading')}: ${err.message}</p>`;
    }
}

function renderStations(stations) {
    const panel = document.getElementById('stationsPanel');
    if (stations.length === 0) {
        panel.innerHTML = `<p style="color:#6c757d;font-size:.85rem;">${I18N.t('no_stations')}</p>`;
        return;
    }
    panel.innerHTML = stations.map(cp => {
        const cls = cp.status === 'ONLINE' ? 'online' : 'offline';
        const vm = [cp.vendor, cp.model].filter(Boolean).join(' / ') || '–';
        const active = cp.chargePointId === selectedChargePointId ? ' active' : '';
        const statusLabel = cp.status === 'ONLINE' ? I18N.t('label_online') : I18N.t('label_offline');
        return `<div class="station-item${active}" data-cpid="${cp.chargePointId}" onclick="selectStation('${cp.chargePointId}')">
            <div>
                <div class="station-name"><span class="status-dot ${cls}"></span>${cp.chargePointId}</div>
                <div class="station-meta">${vm}</div>
            </div>
            <span style="font-size:.75rem;color:#6c757d;">${statusLabel}</span>
        </div>`;
    }).join('');
}

async function fetchAllCommands(ids) {
    for (const id of ids) {
        try {
            const res = await fetch(`${API_BASE}/${id}/commands`);
            if (res.ok) commandsCache[id] = await res.json();
        } catch (_) { /* skip */ }
    }
}

function connectorChipHtml(c) {
    const s = c.status.toLowerCase();
    let cls = 'other';
    if (s === 'available' || s === 'preparing') cls = 'avail';
    else if (s === 'charging') cls = 'charg';
    else if (s === 'faulted') cls = 'fault';
    else if (s === 'unavailable') cls = 'unavail';
    return `<span class="connector-chip ${cls}"><span class="cid">#${c.connectorId}</span> ${c.status}</span>`;
}

let connectorRefreshTimer = null;
function selectStation(cpId) {
    if (connectorRefreshTimer) { clearInterval(connectorRefreshTimer); connectorRefreshTimer = null; }
    selectedChargePointId = cpId;
    renderStations(Array.from(document.querySelectorAll('.station-item')).map(el => ({
        chargePointId: el.dataset.cpid,
    })));
    loadStations();
    populateCommands(cpId);
    loadConnectorStatus(cpId);
    connectorRefreshTimer = setInterval(() => {
        if (selectedChargePointId) loadConnectorStatus(selectedChargePointId);
    }, 10000);
}

async function loadConnectorStatus(cpId) {
    const el = document.getElementById('connectorStatus');
    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(cpId)}`);
        if (!res.ok) { el.innerHTML = ''; return; }
        const cp = await res.json();
        const conns = cp.connectors || [];
        if (conns.length === 0) { el.innerHTML = ''; return; }
        el.innerHTML = `<div class="connector-list"><div class="connector-list-title">${I18N.t('label_connectors')}</div>${conns.map(connectorChipHtml).join('')}</div>`;
    } catch (_) {
        el.innerHTML = '';
    }
}

function populateCommands(cpId) {
    const sel = document.getElementById('cmdSelect');
    sel.disabled = false;
    sel.innerHTML = `<option value="">${I18N.t('select_command_pick')}</option>`;
    const cmds = commandsCache[cpId] || [];
    for (const name of cmds) {
        const def = CMD_DEFS[name];
        const label = def ? I18N.t(def.labelKey) : name;
        sel.innerHTML += `<option value="${name}">${label}</option>`;
    }
    sel.value = '';
    document.getElementById('commandForm').innerHTML = '';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('responseArea').innerHTML = `<span class="empty">${I18N.t('no_response_yet')}</span>`;
    document.getElementById('responseInfo').textContent = '';
}

document.getElementById('cmdSelect').addEventListener('change', function() {
    const cmdName = this.value;
    if (!cmdName) {
        document.getElementById('commandForm').innerHTML = '';
        document.getElementById('sendBtn').disabled = true;
        return;
    }
    buildForm(cmdName);
    document.getElementById('sendBtn').disabled = false;
});

function buildForm(cmdName) {
    const def = CMD_DEFS[cmdName];
    if (!def) {
        document.getElementById('commandForm').innerHTML =
            `<p style="color:#6c757d;font-size:.85rem;">${I18N.t('no_fields')}</p><div class="form-group"><label>${I18N.t('payload_json')}</label><textarea id="rawJson" rows="4"></textarea></div>`;
        return;
    }
    if (def.fields.length === 0) {
        document.getElementById('commandForm').innerHTML =
            `<p style="color:#6c757d;font-size:.85rem;">${I18N.t('no_params')}</p>`;
        return;
    }
    let html = '';
    for (const f of def.fields) {
        const req = f.required ? '<span class="required">*</span>' : '';
        const opt = !f.required ? ` <span class="optional">${I18N.t('optional')}</span>` : '';
        const hint = f.hintKey ? `<div class="hint">${I18N.t(f.hintKey)}</div>` : '';
        const id = `f_${f.name}`;
        const label = I18N.t(f.labelKey);
        html += `<div class="form-group"><label for="${id}">${label}${req}${opt}</label>`;
        if (f.type === 'select') {
            html += `<select id="${id}" ${f.required ? 'required' : ''}>`;
            html += `<option value="">${I18N.t('select_pick')}</option>`;
            for (const o of f.options) html += `<option value="${o}">${o}</option>`;
            html += `</select>`;
        } else if (f.type === 'textarea' || f.type === 'json') {
            html += `<textarea id="${id}" rows="${f.type === 'json' ? 4 : 3}"></textarea>`;
        } else if (f.type === 'number') {
            html += `<input type="number" id="${id}" ${f.required ? 'required' : ''}>`;
        } else {
            html += `<input type="text" id="${id}" ${f.required ? 'required' : ''}>`;
        }
        html += `${hint}</div>`;
    }
    document.getElementById('commandForm').innerHTML = html;
}

async function sendCommand() {
    const cmdName = document.getElementById('cmdSelect').value;
    if (!cmdName || !selectedChargePointId) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = I18N.t('btn_sending');

    const payload = buildPayload(cmdName);
    if (payload === null) {
        btn.disabled = false;
        btn.textContent = I18N.t('btn_send');
        return;
    }

    const area = document.getElementById('responseArea');
    const info = document.getElementById('responseInfo');
    area.textContent = I18N.t('waiting_response');
    info.textContent = `\u203a ${selectedChargePointId} / ${cmdName}`;

    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(selectedChargePointId)}/commands/${cmdName}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const text = await res.text();
        let formatted;
        try {
            formatted = JSON.stringify(JSON.parse(text), null, 2);
        } catch (_) {
            formatted = text;
        }
        const cls = res.ok ? 'success' : 'error';
        area.innerHTML = `<span class="${cls}">${res.status} ${res.statusText}</span>\n\n${formatted}`;
    } catch (err) {
        area.innerHTML = `<span class="error">${I18N.t('network_error')}: ${err.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.textContent = I18N.t('btn_send');
    }
}

function buildPayload(cmdName) {
    const def = CMD_DEFS[cmdName];
    if (!def || def.fields.length === 0) return {};

    if (!def) {
        const raw = document.getElementById('rawJson');
        try { return JSON.parse(raw.value || '{}'); }
        catch (e) { alert(`${I18N.t('invalid_json')}: ${e.message}`); return null; }
    }

    const payload = {};
    for (const f of def.fields) {
        const el = document.getElementById(`f_${f.name}`);
        if (!el) continue;
        let val;
        if (f.type === 'number') {
            val = el.value !== '' ? Number(el.value) : null;
        } else if (f.type === 'select') {
            val = el.value || null;
        } else if (f.type === 'json') {
            if (el.value.trim() === '') {
                if (f.required) { alert(`${I18N.t(f.labelKey)} ${I18N.t('field_required')}`); return null; }
                continue;
            }
            try { val = JSON.parse(el.value); }
            catch (e) { alert(`${I18N.t('invalid_json')}: ${e.message}`); return null; }
        } else {
            val = el.value.trim() || null;
        }

        if (val === null || val === '') {
            if (f.required) { alert(`${I18N.t(f.labelKey)} ${I18N.t('field_required')}`); return null; }
            continue;
        }

        payload[f.name] = val;
    }
    return payload;
}

function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

document.addEventListener('langchange', () => {
    if (selectedChargePointId) {
        populateCommands(selectedChargePointId);
        loadConnectorStatus(selectedChargePointId);
    }
});

(async () => {
    await loadStations();
    const cpFromUrl = getUrlParam('cp');
    if (cpFromUrl && commandsCache[cpFromUrl]) {
        selectStation(cpFromUrl);
        document.querySelector('.header-title').textContent = `${I18N.t('station_prefix')} ${cpFromUrl}`;
    }
})();
</script>
</body>
</html>
