<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_messages">OCPP Nachrichten</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9; color: #1a1a2e; min-height: 100vh;
}
header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 1.4rem; font-weight: 600; }
header a { color: #8ab4f8; text-decoration: none; font-size: .85rem; }
header a:hover { text-decoration: underline; }
.lang-select {
    background: transparent; color: #8ab4f8; border: 1px solid rgba(138,180,248,.3);
    border-radius: 4px; padding: .2rem .4rem; font-size: .8rem; cursor: pointer;
    margin-left: .5rem;
}
.lang-select:hover { background: rgba(255,255,255,.1); }
.lang-select option { color: #1a1a2e; background: #fff; }
.header-right { display: flex; align-items: center; }
.container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
.panel {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
}
.panel h2 {
    font-size: .9rem; text-transform: uppercase; letter-spacing: .05em;
    padding: 1rem 1.2rem; background: #f8f9fa; border-bottom: 1px solid #eee;
    color: #495057; font-weight: 600;
}
.panel-body { padding: 1.2rem; }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 2px solid #eee; margin-bottom: 1rem; }
.tab {
    padding: .6rem 1.2rem; font-size: .85rem; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px; color: #6c757d;
    background: none; border-top: none; border-left: none; border-right: none;
    transition: all .15s;
}
.tab:hover { color: #1a1a2e; background: #f8f9ff; }
.tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

/* Filters */
.filters { display: flex; gap: .8rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filters select, .filters input {
    padding: .4rem .6rem; border: 1px solid #ced4da; border-radius: 6px;
    font-size: .82rem; background: #fff;
}
.filters select:focus, .filters input:focus {
    outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,.15);
}

/* Message list */
.message-list { max-height: 600px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
.message-item {
    padding: .7rem 1rem; border-bottom: 1px solid #f0f0f0;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: .78rem;
    display: flex; gap: .8rem; align-items: flex-start;
}
.message-item:last-child { border-bottom: none; }
.message-item:hover { background: #f8f9ff; }
.msg-direction {
    font-weight: 700; font-size: .7rem; padding: .15rem .4rem; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; min-width: 65px; text-align: center;
}
.msg-direction.inbound { background: #cce5ff; color: #004085; }
.msg-direction.outbound { background: #d4edda; color: #155724; }
.msg-type {
    font-weight: 600; font-size: .7rem; color: #6c757d; min-width: 85px; flex-shrink: 0;
}
.msg-action {
    font-weight: 600; color: #495057; min-width: 170px; flex-shrink: 0;
}
.msg-payload {
    flex: 1; color: #1a1a2e; word-break: break-all; white-space: pre-wrap;
    max-height: 100px; overflow-y: auto;
}
.msg-time {
    font-size: .7rem; color: #6c757d; white-space: nowrap; flex-shrink: 0; min-width: 80px; text-align: right;
}
.loading { text-align: center; padding: 2rem; color: #6c757d; }
.empty { text-align: center; padding: 2rem; color: #6c757d; }
.error { text-align: center; padding: 2rem; color: #721c24; background: #f8d7da; border-radius: 10px; }

/* Station selector */
.station-select-area { margin-bottom: 1rem; }
.station-select-area select {
    width: 100%; max-width: 400px; padding: .55rem .75rem; border: 1px solid #ced4da;
    border-radius: 6px; font-size: .88rem; background: #fff;
}

/* Status bar */
.status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: .5rem 0; font-size: .78rem; color: #6c757d;
}
.btn {
    padding: .4rem .8rem; border: none; border-radius: 6px; font-size: .82rem;
    font-weight: 600; cursor: pointer; transition: all .15s;
}
.btn-sm { padding: .3rem .6rem; font-size: .78rem; }
.btn-outline { background: transparent; border: 1px solid #ced4da; color: #495057; }
.btn-outline:hover { background: #f8f9fa; }
.live-indicator {
    display: inline-flex; align-items: center; gap: .3rem; font-size: .75rem; color: #28a745; font-weight: 600;
}
.live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #28a745;
    animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
</style>
</head>
<body>
<header>
    <h1 class="header-title" data-i18n="page_messages">OCPP Nachrichten</h1>
    <div class="header-right">
        <a href="/stations.html" data-i18n="nav_stations">Stationen</a>
        <a href="/commands.html" style="margin-left:.5rem;" data-i18n="nav_commands">Remote Commands</a>
        <select id="langSelect" class="lang-select">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
        </select>
    </div>
</header>
<div class="container">
    <div class="panel">
        <h2 data-i18n="label_messages">OCPP Nachrichten</h2>
        <div class="panel-body">
            <div class="station-select-area">
                <select id="stationSelect" required>
                    <option value="" data-i18n="select_station">– Station wählen –</option>
                </select>
            </div>
            <div id="contentArea">
                <p class="empty" data-i18n="select_station_first">Wählen Sie zuerst eine Station</p>
            </div>
        </div>
    </div>
</div>

<script src="/i18n.js"></script>
<script>
const API_BASE = '/api/chargepoints';
let selectedCpId = null;
let refreshTimer = null;
let currentTab = 'live';

/* ── Stationen laden ───────────────────────────────────── */
async function loadStations() {
    const sel = document.getElementById('stationSelect');
    try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        sel.innerHTML = `<option value="">${I18N.t('select_station')}</option>`;
        for (const cp of data) {
            const opt = document.createElement('option');
            opt.value = cp.chargePointId;
            opt.textContent = `${cp.chargePointId}`;
            if (cp.vendor) opt.textContent += ` (${cp.vendor} ${cp.model})`;
            sel.appendChild(opt);
        }
        const cpFromUrl = new URLSearchParams(window.location.search).get('cp');
        if (cpFromUrl) {
            sel.value = cpFromUrl;
            selectStation(cpFromUrl);
        }
    } catch (err) {
        sel.innerHTML = `<option value="">Fehler: ${err.message}</option>`;
    }
}

document.getElementById('stationSelect').addEventListener('change', function() {
    selectStation(this.value);
});

function selectStation(cpId) {
    selectedCpId = cpId;
    if (refreshTimer) clearInterval(refreshTimer);
    if (cpId) {
        renderContent();
        refreshTimer = setInterval(() => { if (selectedCpId) renderLiveTab(); }, 3000);
    } else {
        document.getElementById('contentArea').innerHTML = `<p class="empty">${I18N.t('select_station_first')}</p>`;
    }
    document.querySelector('.header-title').textContent = cpId
        ? `${I18N.t('station_prefix')} ${cpId}`
        : I18N.t('page_messages');
}

/* ── Content Render ────────────────────────────────────── */
function renderContent() {
    document.getElementById('contentArea').innerHTML = `
        <div class="tabs">
            <button class="tab active" data-tab="live" onclick="switchTab('live')">Live</button>
            <button class="tab" data-tab="history" onclick="switchTab('history')">Historie</button>
        </div>
        <div class="filters">
            <label style="font-size:.78rem;font-weight:600;">${I18N.t('filter_direction')}:</label>
            <select id="filterDirection">
                <option value="">${I18N.t('filter_all')}</option>
                <option value="INBOUND">C→S ${I18N.t('filter_inbound')}</option>
                <option value="OUTBOUND">S→C ${I18N.t('filter_outbound')}</option>
            </select>
            <label style="font-size:.78rem;font-weight:600;">${I18N.t('filter_action')}:</label>
            <input type="text" id="filterAction" placeholder="z.B. Heartbeat">
            <button class="btn btn-sm btn-outline" onclick="applyFilters()" data-i18n="btn_apply">Anwenden</button>
            <div class="status-bar" style="margin-left:auto;">
                <span id="msgCount">0 ${I18N.t('label_messages_lower')}</span>
                <span class="live-indicator" id="liveIndicator" style="display:none;">
                    <span class="live-dot"></span> ${I18N.t('label_live')}
                </span>
            </div>
        </div>
        <div class="message-list" id="messageList">
            <p class="loading">${I18N.t('loading_messages')}</p>
        </div>
    `;
    renderLiveTab();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('liveIndicator').style.display = tab === 'live' ? 'inline-flex' : 'none';
    if (tab === 'live') renderLiveTab();
    else renderHistoryTab();
}

async function applyFilters() {
    if (currentTab === 'live') renderLiveTab();
    else renderHistoryTab();
}

/* ── Live Tab ──────────────────────────────────────────── */
async function renderLiveTab() {
    if (!selectedCpId) return;
    const list = document.getElementById('messageList');
    const direction = document.getElementById('filterDirection')?.value || '';
    const action = document.getElementById('filterAction')?.value || '';
    try {
        let url = `/api/chargepoints/${encodeURIComponent(selectedCpId)}/messages?limit=200`;
        if (direction) url += `&direction=${encodeURIComponent(direction)}`;
        if (action) url += `&action=${encodeURIComponent(action)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderMessages(data);
    } catch (err) {
        list.innerHTML = `<p class="error">${I18N.t('error_loading')}: ${err.message}</p>`;
    }
}

/* ── History Tab ───────────────────────────────────────── */
async function renderHistoryTab() {
    if (!selectedCpId) return;
    const list = document.getElementById('messageList');
    const direction = document.getElementById('filterDirection')?.value || '';
    const action = document.getElementById('filterAction')?.value || '';
    try {
        let url = `/api/chargepoints/${encodeURIComponent(selectedCpId)}/messages/history?limit=200`;
        if (direction) url += `&direction=${encodeURIComponent(direction)}`;
        if (action) url += `&action=${encodeURIComponent(action)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        renderMessages(result.messages || []);
    } catch (err) {
        list.innerHTML = `<p class="error">${I18N.t('error_loading')}: ${err.message}</p>`;
    }
}

/* ── Message Renderer ──────────────────────────────────── */
function renderMessages(messages) {
    const list = document.getElementById('messageList');
    const countEl = document.getElementById('msgCount');
    if (messages.length === 0) {
        list.innerHTML = `<p class="empty">${I18N.t('no_messages')}</p>`;
        if (countEl) countEl.textContent = `0 ${I18N.t('label_messages_lower')}`;
        return;
    }
    const loc = document.documentElement.dataset.dateLocale || 'de-DE';
    list.innerHTML = messages.map(msg => {
        const dirCls = msg.direction === 'INBOUND' ? 'inbound' : 'outbound';
        const dirLabel = msg.direction === 'INBOUND' ? 'C→S' : 'S→C';
        const timeStr = new Date(msg.timestamp).toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        const payloadPreview = msg.payload ? (msg.payload.length > 300 ? msg.payload.substring(0, 300) + '…' : msg.payload) : '–';
        return `<div class="message-item">
            <span class="msg-direction ${dirCls}">${dirLabel}</span>
            <span class="msg-type">${msg.messageType}</span>
            <span class="msg-action">${msg.action || '–'}</span>
            <span class="msg-payload" title="${escapeAttr(msg.payload || '')}">${escapeHtml(payloadPreview)}</span>
            <span class="msg-time">${timeStr}</span>
        </div>`;
    }).join('');
    if (countEl) countEl.textContent = `${messages.length} ${I18N.t('label_messages_lower')}`;
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function escapeAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── Lang change ───────────────────────────────────────── */
document.addEventListener('langchange', () => {
    if (selectedCpId) renderContent();
});

/* ── Init ──────────────────────────────────────────────── */
loadStations();
</script>
</body>
</html>
