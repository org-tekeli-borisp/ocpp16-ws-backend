<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_stations">OCPP Stationen</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9; color: #1a1a2e; min-height: 100vh;
}
header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 1.2rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; }
.header-info { font-size: .85rem; opacity: .85; display: flex; align-items: center; gap: 1rem; }
.header-info a { color: #8ab4f8; text-decoration: none; }
.header-info a:hover { text-decoration: underline; }
.lang-select {
    background: transparent; color: #8ab4f8; border: 1px solid rgba(138,180,248,.3);
    border-radius: 4px; padding: .2rem .4rem; font-size: .8rem; cursor: pointer;
}
.lang-select:hover { background: rgba(255,255,255,.1); }
.lang-select option { color: #1a1a2e; background: #fff; }
.container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
.stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem; margin-bottom: 2rem;
}
.stat-card {
    background: #fff; border-radius: 10px; padding: 1.2rem 1.5rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center;
}
.stat-card .value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
.stat-card .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; margin-top: .25rem; }
.stat-card.online .value { color: #28a745; }
.stat-card.offline .value { color: #dc3545; }
.stat-card.total .value { color: #1a1a2e; }
table {
    width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
th, td { padding: .85rem 1.2rem; text-align: left; }
th { background: #f8f9fa; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; font-weight: 600; }
tbody tr { cursor: pointer; }
tr:not(:last-child) td { border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #f8f9ff; }
.status-badge {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .25rem .7rem; border-radius: 20px;
    font-size: .8rem; font-weight: 600;
}
.status-badge.online { background: #d4edda; color: #155724; }
.status-badge.offline { background: #f8d7da; color: #721c24; }
.status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.status-dot.online { background: #28a745; }
.status-dot.offline { background: #dc3545; }
.vendor-model { font-size: .85rem; color: #495057; }
.connector-list { display: flex; flex-wrap: wrap; gap: .3rem; }
.connector-chip {
    display: inline-flex; align-items: center; gap: .2rem;
    padding: .15rem .45rem; border-radius: 4px;
    font-size: .7rem; font-weight: 600; white-space: nowrap;
}
.connector-chip .cid { color: #6c757d; font-weight: 400; margin-right: .15rem; }
.connector-chip.avail { background: #d4edda; color: #155724; }
.connector-chip.charg { background: #cce5ff; color: #004085; }
.connector-chip.fault { background: #f8d7da; color: #721c24; }
.connector-chip.other { background: #fff3cd; color: #856404; }
.connector-chip.unavail { background: #e2e3e5; color: #383d41; }
.connectors-col { min-width: 140px; }
.last-seen { font-size: .82rem; color: #6c757d; }
.loading { text-align: center; padding: 3rem; color: #6c757d; }
.error { text-align: center; padding: 2rem; color: #721c24; background: #f8d7da; border-radius: 10px; }
.empty { text-align: center; padding: 3rem; color: #6c757d; }
footer {
    text-align: center; padding: 2rem; color: #6c757d; font-size: .8rem;
}
</style>
</head>
<body>
<header>
    <h1 data-i18n="page_stations">OCPP Stationen</h1>
    <div class="header-info">
        <a href="/commands.html" data-i18n="nav_commands">Remote Commands</a>
        <span style="opacity:.4">|</span>
        <select id="langSelect" class="lang-select" data-i18n-label="lang_label">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
        </select>
        <span style="opacity:.4">|</span>
        <span id="updateTime"></span>
        <span style="opacity:.4">|</span>
        <span data-i18n="auto_refresh">Aktualisierung alle 10s</span>
    </div>
</header>
<div class="container">
    <div class="stats" id="stats"></div>
    <table>
        <thead>
            <tr>
                <th data-i18n="label_station">Station</th>
                <th data-i18n="label_vendor_model">Hersteller / Modell</th>
                <th data-i18n="label_firmware">Firmware</th>
                <th data-i18n="label_status">Status</th>
                <th class="connectors-col" data-i18n="label_connectors">Konnektoren</th>
                <th data-i18n="label_connected_since">Verbunden seit</th>
                <th data-i18n="label_last_seen">Zuletzt gesehen</th>
            </tr>
        </thead>
        <tbody id="stationsBody">
            <tr><td colspan="7" class="loading" data-i18n="loading_stations">Lade Stationen…</td></tr>
        </tbody>
    </table>
</div>
<footer data-i18n="footer_text">OCPP 1.6 Central System</footer>

<script src="/i18n.js"></script>
<script>
const API_URL = '/api/chargepoints';
const REFRESH_MS = 10000;
let timer;

const getDateLocale = () => document.documentElement.dataset.dateLocale || 'de-DE';

function formatDateTime(iso) {
    if (!iso) return '–';
    const d = new Date(iso);
    const loc = getDateLocale();
    return d.toLocaleDateString(loc, { day:'2-digit', month:'2-digit', year:'numeric' })
        + ' ' + d.toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });
}

function timeAgo(iso) {
    if (!iso) return '–';
    const diff = Date.now() - new Date(iso).getTime();
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return I18N.t('just_now');
    const min = Math.floor(sec / 60);
    if (min < 60) return `${I18N.t('time_ago_min')} ${min} ${I18N.t('time_unit_min')}`;
    const h = Math.floor(min / 60);
    if (h < 24) return `${I18N.t('time_ago_min')} ${h} ${I18N.t('time_unit_hour')}`;
    return formatDateTime(iso);
}

function statusBadgeHtml(status) {
    const cls = status === 'ONLINE' ? 'online' : 'offline';
    const label = status === 'ONLINE' ? I18N.t('label_online') : I18N.t('label_offline');
    return `<span class="status-badge ${cls}"><span class="status-dot ${cls}"></span>${label}</span>`;
}

function connectorChipHtml(c) {
    const s = c.status.toLowerCase();
    let cls = 'other';
    if (s === 'available' || s === 'preparing') cls = 'avail';
    else if (s === 'charging') cls = 'charg';
    else if (s === 'faulted') cls = 'fault';
    else if (s === 'unavailable') cls = 'unavail';
    return `<span class="connector-chip ${cls}"><span class="cid">#${c.connectorId}</span> ${c.status}</span>`;
}

function render(data) {
    const total = data.length;
    const online = data.filter(cp => cp.status === 'ONLINE').length;
    const offline = total - online;
    const totalConnectors = data.reduce((s, cp) => s + (cp.connectors || []).length, 0);

    document.getElementById('stats').innerHTML = `
        <div class="stat-card total"><div class="value">${total}</div><div class="label">${I18N.t('label_stations')}</div></div>
        <div class="stat-card online"><div class="value">${online}</div><div class="label">${I18N.t('label_online')}</div></div>
        <div class="stat-card offline"><div class="value">${offline}</div><div class="label">${I18N.t('label_offline')}</div></div>
        <div class="stat-card total"><div class="value">${totalConnectors}</div><div class="label">${I18N.t('label_connectors')}</div></div>
    `;

    const tbody = document.getElementById('stationsBody');
    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">${I18N.t('no_stations')}</td></tr>`;
        return;
    }

    tbody.innerHTML = data.map(cp => {
        const vm = [cp.vendor, cp.model].filter(Boolean).join(' / ') || '–';
        const conns = (cp.connectors || []).map(connectorChipHtml).join('') || '<span style="color:#6c757d;font-size:.78rem;">–</span>';
        return `<tr onclick="window.location='/commands.html?cp=${encodeURIComponent(cp.chargePointId)}'">
            <td><strong>${cp.chargePointId}</strong></td>
            <td class="vendor-model">${vm}</td>
            <td class="vendor-model">${cp.firmwareVersion || '–'}</td>
            <td>${statusBadgeHtml(cp.status)}</td>
            <td class="connectors-col"><div class="connector-list">${conns}</div></td>
            <td class="last-seen">${formatDateTime(cp.createdAt)}</td>
            <td class="last-seen" title="${formatDateTime(cp.lastSeenAt)}">${timeAgo(cp.lastSeenAt)}</td>
        </tr>`;
    }).join('');
}

async function fetchStations() {
    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
    } catch (err) {
        document.getElementById('stationsBody').innerHTML =
            `<tr><td colspan="7" class="error">${I18N.t('error_loading')}: ${err.message}</td></tr>`;
    }
}

function updateTimestamp() {
    const loc = getDateLocale();
    document.getElementById('updateTime').textContent =
        I18N.t('timestamp_prefix') + ' ' + new Date().toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function refresh() {
    fetchStations();
    updateTimestamp();
}

fetchStations();
updateTimestamp();
timer = setInterval(refresh, REFRESH_MS);

document.addEventListener('langchange', () => {
    refresh();
});
</script>
</body>
</html>
