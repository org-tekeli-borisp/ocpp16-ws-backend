<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_stations">OCPP Central System</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9; color: #1a1a2e; min-height: 100vh;
    display: flex; flex-direction: column;
}

/* ── Header ───────────────────────────────── */
header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff; padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); flex-shrink: 0;
    z-index: 10;
}
header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: .02em; }
.header-right { display: flex; align-items: center; gap: .8rem; }
.header-right a { color: #8ab4f8; text-decoration: none; font-size: .82rem; }
.header-right a:hover { text-decoration: underline; }
.station-badge {
    background: rgba(255,255,255,.12); border-radius: 6px; padding: .3rem .7rem;
    font-size: .82rem; font-weight: 600; display: none;
}
.station-badge.visible { display: inline-flex; align-items: center; gap: .4rem; }
.lang-select {
    background: transparent; color: #8ab4f8; border: 1px solid rgba(138,180,248,.3);
    border-radius: 4px; padding: .2rem .4rem; font-size: .8rem; cursor: pointer;
}
.lang-select:hover { background: rgba(255,255,255,.1); }
.lang-select option { color: #1a1a2e; background: #fff; }

/* ── Layout ───────────────────────────────── */
.layout {
    display: flex; flex: 1; overflow: hidden;
    height: calc(100vh - 56px);
}

/* ── Sidebar ──────────────────────────────── */
.sidebar {
    width: 260px; background: #fff; border-right: 1px solid #e8e8e8;
    display: flex; flex-direction: column; flex-shrink: 0;
    overflow: hidden;
}
.sidebar-header {
    padding: .8rem 1rem; border-bottom: 1px solid #e8e8e8;
    display: flex; flex-direction: column; gap: .5rem;
}
.sidebar-header h2 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
    color: #6c757d; font-weight: 600;
}
.sidebar-stats {
    display: flex; gap: .5rem; font-size: .72rem; color: #6c757d;
}
.sidebar-stats span { font-weight: 600; }
.sidebar-stats .online-c { color: #28a745; }
.sidebar-stats .offline-c { color: #dc3545; }
.search-box {
    width: 100%; padding: .4rem .6rem; border: 1px solid #ced4da; border-radius: 6px;
    font-size: .82rem;
}
.search-box:focus { outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,.15); }
.sidebar-list {
    flex: 1; overflow-y: auto; padding: .4rem 0;
}
.station-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: .6rem 1rem; cursor: pointer; transition: background .1s;
}
.station-item:hover { background: #f8f9ff; }
.station-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; padding-left: .7rem; }
.station-name { font-weight: 600; font-size: .85rem; display: flex; align-items: center; gap: .35rem; }
.station-meta { font-size: .72rem; color: #6c757d; margin-top: .1rem; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.status-dot.online { background: #28a745; }
.status-dot.offline { background: #dc3545; }
.status-label { font-size: .7rem; color: #6c757d; }

/* ── Main Content ─────────────────────────── */
.main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Tabs ─────────────────────────────────── */
.tabs {
    display: flex; border-bottom: 2px solid #eee; background: #fff;
    padding: 0 1.5rem; flex-shrink: 0;
}
.tab {
    padding: .7rem 1.2rem; font-size: .85rem; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px; color: #6c757d;
    background: none; border-top: none; border-left: none; border-right: none;
    transition: all .15s;
}
.tab:hover { color: #1a1a2e; background: #f8f9ff; }
.tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

/* ── Content Area ─────────────────────────── */
.content {
    flex: 1; overflow-y: auto; padding: 1.5rem;
}
.panel {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    overflow: hidden; margin-bottom: 1.5rem;
}
.panel h2 {
    font-size: .85rem; text-transform: uppercase; letter-spacing: .05em;
    padding: .8rem 1.2rem; background: #f8f9fa; border-bottom: 1px solid #eee;
    color: #495057; font-weight: 600;
}
.panel-body { padding: 1.2rem; }

/* ── Overview Tab ─────────────────────────── */
.overview-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}
.info-card {
    background: #f8f9fa; border-radius: 8px; padding: 1rem;
}
.info-card .info-label {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: #6c757d; font-weight: 600; margin-bottom: .3rem;
}
.info-card .info-value { font-size: 1rem; font-weight: 600; }
.connector-list { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; }
.connector-chip {
    display: inline-flex; align-items: center; gap: .2rem;
    padding: .15rem .45rem; border-radius: 4px;
    font-size: .7rem; font-weight: 600; white-space: nowrap;
}
.connector-chip .cid { color: #6c757d; font-weight: 400; margin-right: .15rem; }
.connector-chip.avail { background: #d4edda; color: #155724; }
.connector-chip.charg { background: #cce5ff; color: #004085; }
.connector-chip.fault { background: #f8d7da; color: #721c24; }
.connector-chip.other { background: #fff3cd; color: #856404; }
.connector-chip.unavail { background: #e2e3e5; color: #383d41; }

/* ── Commands Tab ─────────────────────────── */
.form-group { margin-bottom: 1rem; }
.form-group:last-child { margin-bottom: 0; }
.form-group label {
    display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; color: #495057;
}
.form-group label .required { color: #dc3545; margin-left: 2px; }
.form-group label .optional { color: #6c757d; font-weight: 400; font-size: .75rem; }
.form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: .55rem .75rem; border: 1px solid #ced4da; border-radius: 6px;
    font-size: .88rem; font-family: inherit; transition: border-color .15s; background: #fff;
}
.form-group textarea { min-height: 80px; resize: vertical; font-family: "SFMono-Regular", Consolas, monospace; font-size: .82rem; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74, 158, 255, .15);
}
.form-group .hint { font-size: .75rem; color: #6c757d; margin-top: .25rem; }
select:invalid { color: #6c757d; }
.btn {
    padding: .6rem 1.5rem; border: none; border-radius: 6px; font-size: .88rem;
    font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: .4rem;
}
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-primary:disabled { background: #a8c7fa; cursor: not-allowed; }
.btn-sm { padding: .3rem .6rem; font-size: .78rem; }
.btn-outline { background: transparent; border: 1px solid #ced4da; color: #495057; }
.btn-outline:hover { background: #f8f9fa; }
.response-area {
    background: #1a1a2e; color: #e8e8e8; border-radius: 8px; padding: 1rem;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: .8rem; max-height: 400px; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
}
.response-area .empty { color: #6c757d; font-style: italic; }
.response-area .success { color: #28a745; }
.response-area .error { color: #f85149; }
.response-info { font-size: .78rem; color: #6c757d; margin-bottom: .5rem; }

/* ── Messages Tab ─────────────────────────── */
.msg-tabs { display: flex; gap: 0; margin-bottom: 1rem; }
.msg-tab {
    padding: .5rem 1rem; font-size: .82rem; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px; color: #6c757d;
    background: none; border-top: none; border-left: none; border-right: none;
    transition: all .15s;
}
.msg-tab:hover { color: #1a1a2e; }
.msg-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
.filters { display: flex; gap: .8rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filters select, .filters input {
    padding: .4rem .6rem; border: 1px solid #ced4da; border-radius: 6px;
    font-size: .82rem; background: #fff;
}
.filters select:focus, .filters input:focus {
    outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,.15);
}
.message-list { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
.message-item {
    padding: .6rem .8rem; border-bottom: 1px solid #f0f0f0;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: .76rem;
    display: flex; gap: .6rem; align-items: flex-start;
}
.message-item:last-child { border-bottom: none; }
.message-item:hover { background: #f8f9ff; }
.msg-direction {
    font-weight: 700; font-size: .68rem; padding: .12rem .35rem; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; min-width: 55px; text-align: center;
}
.msg-direction.inbound { background: #cce5ff; color: #004085; }
.msg-direction.outbound { background: #d4edda; color: #155724; }
.msg-type {
    font-weight: 600; font-size: .68rem; color: #6c757d; min-width: 75px; flex-shrink: 0;
}
.msg-action {
    font-weight: 600; color: #495057; min-width: 150px; flex-shrink: 0;
}
.msg-payload {
    flex: 1; color: #1a1a2e; word-break: break-all; white-space: pre-wrap;
    max-height: 100px; overflow-y: auto;
}
.msg-time {
    font-size: .68rem; color: #6c757d; white-space: nowrap; flex-shrink: 0; min-width: 70px; text-align: right;
}
.status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: .4rem 0; font-size: .75rem; color: #6c757d;
}
.live-indicator {
    display: inline-flex; align-items: center; gap: .3rem; font-size: .72rem; color: #28a745; font-weight: 600;
}
.live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #28a745;
    animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

/* ── States ───────────────────────────────── */
.loading { text-align: center; padding: 2rem; color: #6c757d; }
.empty { text-align: center; padding: 2rem; color: #6c757d; }
.error { text-align: center; padding: 2rem; color: #721c24; background: #f8d7da; border-radius: 10px; }
.no-selection {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #6c757d; font-size: .95rem; text-align: center; padding: 2rem;
}

/* ── Responsive ───────────────────────────── */
@media (max-width: 768px) {
    .sidebar { width: 200px; }
    .layout { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 250px; border-right: none; border-bottom: 1px solid #e8e8e8; }
}
</style>
</head>
<body>
<header>
    <h1 data-i18n="page_stations">OCPP Central System</h1>
    <div class="header-right">
        <span class="station-badge" id="stationBadge">
            <span class="status-dot" id="badgeDot"></span>
            <span id="badgeName"></span>
        </span>
        <span style="opacity:.4">|</span>
        <select id="langSelect" class="lang-select">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
        </select>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 data-i18n="label_stations">Stationen</h2>
            <div class="sidebar-stats" id="sidebarStats">
                <span class="online-c" id="statOnline">0</span> online &nbsp;
                <span class="offline-c" id="statOffline">0</span> offline
            </div>
            <input type="text" class="search-box" id="searchBox" data-i18n-placeholder="search_placeholder" placeholder="Filtern…">
        </div>
        <div class="sidebar-list" id="stationList">
            <div class="loading" data-i18n="loading_stations">Lade Stationen…</div>
        </div>
    </aside>

    <main class="main">
        <div class="tabs" id="tabBar">
            <button class="tab active" data-tab="overview" data-i18n="tab_overview">Übersicht</button>
            <button class="tab" data-tab="commands" data-i18n="tab_commands">Commands</button>
            <button class="tab" data-tab="messages" data-i18n="tab_messages">Messages</button>
        </div>
        <div class="content" id="contentArea">
            <div class="no-selection" data-i18n="select_station_hint">Wählen Sie eine Station aus der Liste links</div>
        </div>
    </main>
</div>

<script src="/i18n.js"></script>
<script>
const API_BASE = '/api/chargepoints';
const REFRESH_MS = 10000;

let allStations = [];
let selectedCpId = null;
let activeTab = 'overview';
let commandsCache = {};
let refreshTimer = null;
let msgRefreshTimer = null;
let currentMsgTab = 'live';

/* ── CMD_DEFS ───────────────────────────────────────── */
const CMD_DEFS = {
    'reset': {

            { name: 'type', labelKey: 'field_type', type: 'select', required: true, options: ['Hard', 'Soft'] }

/* ── Helpers ────────────────────────────────────────── */
function connectorChipHtml(c) {
    const s = c.status.toLowerCase();
    let cls = 'other';
    if (s === 'available' || s === 'preparing') cls = 'avail';
    else if (s === 'charging') cls = 'charg';
    else if (s === 'faulted') cls = 'fault';
    else if (s === 'unavailable') cls = 'unavail';
    return `<span class="connector-chip ${cls}"><span class="cid">#${c.connectorId}</span> ${c.status}</span>`;
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function escapeAttr(s) {
    return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getDateLocale() { return document.documentElement.dataset.dateLocale || 'de-DE'; }

function formatDateTime(iso) {
    if (!iso) return '–';
    const d = new Date(iso);
    return d.toLocaleDateString(getDateLocale(), { day:'2-digit', month:'2-digit', year:'numeric' })
        + ' ' + d.toLocaleTimeString(getDateLocale(), { hour:'2-digit', minute:'2-digit' });
}

function timeAgo(iso) {
    if (!iso) return '–';
    const diff = Date.now() - new Date(iso).getTime();
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return I18N.t('just_now');
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min} ${I18N.t('time_unit_min')}`;
    const h = Math.floor(min / 60);
    if (h < 24) return `${h} ${I18N.t('time_unit_hour')}`;
    return formatDateTime(iso);
}

/* ── Sidebar ────────────────────────────────────────── */
async function loadStations() {
    try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allStations = await res.json();
        renderSidebar();
        await fetchAllCommands(allStations.map(cp => cp.chargePointId));
    } catch (err) {
        document.getElementById('stationList').innerHTML =
            `<div class="error">${I18N.t('error_loading')}: ${err.message}</div>`;
    }
}

function renderSidebar() {
    const query = (document.getElementById('searchBox').value || '').toLowerCase();
    const filtered = allStations.filter(cp =>
        cp.chargePointId.toLowerCase().includes(query) ||
        (cp.vendor || '').toLowerCase().includes(query) ||
        (cp.model || '').toLowerCase().includes(query)
    );

    const online = allStations.filter(cp => cp.status === 'ONLINE').length;
    const offline = allStations.length - online;
    document.getElementById('statOnline').textContent = online;
    document.getElementById('statOffline').textContent = offline;

    const list = document.getElementById('stationList');
    if (allStations.length === 0) {
        list.innerHTML = `<div class="empty">${I18N.t('no_stations')}</div>`;
        return;
    }

    list.innerHTML = filtered.map(cp => {
        const cls = cp.status === 'ONLINE' ? 'online' : 'offline';
        const vm = [cp.vendor, cp.model].filter(Boolean).join(' / ') || '–';
        const active = cp.chargePointId === selectedCpId ? ' active' : '';
        const statusLabel = cp.status === 'ONLINE' ? I18N.t('label_online') : I18N.t('label_offline');
        return `<div class="station-item${active}" data-cpid="${cp.chargePointId}" onclick="selectStation('${cp.chargePointId}')">
            <div>
                <div class="station-name"><span class="status-dot ${cls}"></span>${cp.chargePointId}</div>
                <div class="station-meta">${vm}</div>
            </div>
            <span class="status-label">${statusLabel}</span>
        </div>`;
    }).join('');
}

document.getElementById('searchBox').addEventListener('input', renderSidebar);

function updateBadge(cp) {
    const badge = document.getElementById('stationBadge');
    const dot = document.getElementById('badgeDot');
    const name = document.getElementById('badgeName');
    if (cp) {
        badge.classList.add('visible');
        dot.className = 'status-dot ' + (cp.status === 'ONLINE' ? 'online' : 'offline');
        name.textContent = cp.chargePointId;
    } else {
        badge.classList.remove('visible');
    }
}

/* ── Select Station ─────────────────────────────────── */
function selectStation(cpId) {
    selectedCpId = cpId;
    const cp = allStations.find(c => c.chargePointId === cpId);
    updateBadge(cp);
    renderSidebar();
    updateUrl(cpId, activeTab);
    clearTimers();
    renderActiveTab();
}

function updateUrl(cpId, tab) {
    const url = new URL(window.location);
    url.searchParams.set('cp', cpId);
    url.hash = tab;
    window.history.replaceState({}, '', url);
}

function clearTimers() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    if (msgRefreshTimer) { clearInterval(msgRefreshTimer); msgRefreshTimer = null; }
}

/* ── Tabs ───────────────────────────────────────────── */
document.getElementById('tabBar').addEventListener('click', function(e) {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    activeTab = tab.dataset.tab;
    document.querySelectorAll('#tabBar .tab').forEach(t => t.classList.toggle('active', t === tab));
    if (selectedCpId) {
        updateUrl(selectedCpId, activeTab);
        clearTimers();
        renderActiveTab();
    }
});

function renderActiveTab() {
    clearTimers();
    if (activeTab === 'overview') renderOverview();
    else if (activeTab === 'commands') renderCommands();
    else if (activeTab === 'messages') renderMessages();
}

/* ── Overview Tab ───────────────────────────────────── */
async function renderOverview() {
    const area = document.getElementById('contentArea');
    if (!selectedCpId) { area.innerHTML = `<div class="no-selection">${I18N.t('select_station_hint')}</div>`; return; }

    area.innerHTML = `<div class="panel"><div class="loading">${I18N.t('loading_stations')}</div></div>`;

    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(selectedCpId)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const cp = await res.json();

        const conns = (cp.connectors || []).map(connectorChipHtml).join('') || '<span style="color:#6c757d;font-size:.78rem;">–</span>';
        const statusCls = cp.status === 'ONLINE' ? 'online' : 'offline';
        const statusLabel = cp.status === 'ONLINE' ? I18N.t('label_online') : I18N.t('label_offline');

        area.innerHTML = `
            <div class="panel">
                <h2>${cp.chargePointId}</h2>
                <div class="panel-body">
                    <div class="overview-grid">
                        <div class="info-card">
                            <div class="info-label">${I18N.t('label_status')}</div>
                            <div class="info-value"><span class="status-dot ${statusCls}"></span>${statusLabel}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">${I18N.t('label_vendor_model')}</div>
                            <div class="info-value">${[cp.vendor, cp.model].filter(Boolean).join(' / ') || '–'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">${I18N.t('label_firmware')}</div>
                            <div class="info-value">${cp.firmwareVersion || '–'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">${I18N.t('label_connected_since')}</div>
                            <div class="info-value">${formatDateTime(cp.createdAt)}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">${I18N.t('label_last_seen')}</div>
                            <div class="info-value">${timeAgo(cp.lastSeenAt)}</div>
                        </div>
                    </div>
                    <div style="margin-top:1.2rem;">
                        <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#6c757d;font-weight:600;margin-bottom:.4rem;">${I18N.t('label_connectors')}</div>
                        <div class="connector-list">${conns}</div>
                    </div>
                </div>
            </div>`;

        refreshTimer = setInterval(async () => {
            try {
                const r = await fetch(`${API_BASE}/${encodeURIComponent(selectedCpId)}`);
                if (!r.ok) return;
                const updated = await r.json();
                const idx = allStations.findIndex(c => c.chargePointId === selectedCpId);
                if (idx >= 0) allStations[idx] = updated;
                updateBadge(updated);
                renderSidebar();
                renderOverview();
            } catch (_) {}
        }, REFRESH_MS);
    } catch (err) {
        area.innerHTML = `<div class="panel"><div class="error">${I18N.t('error_loading')}: ${err.message}</div></div>`;
    }
}

/* ── Commands Tab ───────────────────────────────────── */
function renderCommands() {
    const area = document.getElementById('contentArea');
    if (!selectedCpId) { area.innerHTML = `<div class="no-selection">${I18N.t('select_station_hint')}</div>`; return; }

    const cp = allStations.find(c => c.chargePointId === selectedCpId);
    const conns = cp && cp.connectors ? (cp.connectors.map(connectorChipHtml).join('')) : '';

    const cmds = commandsCache[selectedCpId] || [];
    let cmdOptions = `<option value="">${I18N.t('select_command_pick')}</option>`;
    for (const name of cmds) {
        const def = CMD_DEFS[name];
        const label = def ? I18N.t(def.labelKey) : name;
        cmdOptions += `<option value="${name}">${label}</option>`;
    }

    area.innerHTML = `
        <div class="panel">
            <h2>${I18N.t('label_command')}</h2>
            <div class="panel-body">
                ${conns ? `<div class="connector-list" style="margin-bottom:1rem;"><div class="connector-list-title" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:#6c757d;font-weight:600;width:100%;margin-bottom:.2rem;">${I18N.t('label_connectors')}</div>${conns}</div>` : ''}
                <div class="form-group">
                    <label>${I18N.t('label_command')}</label>
                    <select id="cmdSelect">${cmdOptions}</select>
                </div>
                <div id="commandForm"></div>
                <div style="margin-top:1rem;">
                    <button class="btn btn-primary" id="sendBtn" disabled onclick="sendCommand()">${I18N.t('btn_send')}</button>
                </div>
            </div>
        </div>
        <div class="panel">
            <h2>${I18N.t('response_label')}</h2>
            <div class="panel-body">
                <div class="response-info" id="responseInfo"></div>
                <div class="response-area" id="responseArea"><span class="empty">${I18N.t('no_response_yet')}</span></div>
            </div>
        </div>`;

    document.getElementById('cmdSelect').addEventListener('change', function() {
        const cmdName = this.value;
        if (!cmdName) {
            document.getElementById('commandForm').innerHTML = '';
            document.getElementById('sendBtn').disabled = true;
            return;
        }
        buildForm(cmdName);
        document.getElementById('sendBtn').disabled = false;
    });
}

function buildForm(cmdName) {
    const def = CMD_DEFS[cmdName];
    if (!def) {
        document.getElementById('commandForm').innerHTML =
            `<p style="color:#6c757d;font-size:.85rem;">${I18N.t('no_fields')}</p><div class="form-group"><label>${I18N.t('payload_json')}</label><textarea id="rawJson" rows="4"></textarea></div>`;
        return;
    }
    if (def.fields.length === 0) {
        document.getElementById('commandForm').innerHTML = `<p style="color:#6c757d;font-size:.85rem;">${I18N.t('no_params')}</p>`;
        return;
    }
    let html = '';
    for (const f of def.fields) {
        const req = f.required ? '<span class="required">*</span>' : '';
        const opt = !f.required ? ` <span class="optional">${I18N.t('optional')}</span>` : '';
        const hint = f.hintKey ? `<div class="hint">${I18N.t(f.hintKey)}</div>` : '';
        const id = `f_${f.name}`;
        html += `<div class="form-group"><label for="${id}">${I18N.t(f.labelKey)}${req}${opt}</label>`;
        if (f.type === 'select') {
            html += `<select id="${id}" ${f.required ? 'required' : ''}><option value="">${I18N.t('select_pick')}</option>`;
            for (const o of f.options) html += `<option value="${o}">${o}</option>`;
            html += `</select>`;
        } else if (f.type === 'textarea' || f.type === 'json') {
            html += `<textarea id="${id}" rows="${f.type === 'json' ? 4 : 3}"></textarea>`;
        } else if (f.type === 'number') {
            html += `<input type="number" id="${id}" ${f.required ? 'required' : ''}>`;
        } else {
            html += `<input type="text" id="${id}" ${f.required ? 'required' : ''}>`;
        }
        html += `${hint}</div>`;
    }
    document.getElementById('commandForm').innerHTML = html;
}

async function sendCommand() {
    const cmdName = document.getElementById('cmdSelect').value;
    if (!cmdName || !selectedCpId) return;
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = I18N.t('btn_sending');
    const payload = buildPayload(cmdName);
    if (payload === null) { btn.disabled = false; btn.textContent = I18N.t('btn_send'); return; }
    const area = document.getElementById('responseArea');
    const info = document.getElementById('responseInfo');
    area.textContent = I18N.t('waiting_response');
    info.textContent = `\u203a ${selectedCpId} / ${cmdName}`;
    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(selectedCpId)}/commands/${cmdName}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const text = await res.text();
        let formatted;
        try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch (_) { formatted = text; }
        const cls = res.ok ? 'success' : 'error';
        area.innerHTML = `<span class="${cls}">${res.status} ${res.statusText}</span>\n\n${formatted}`;
    } catch (err) {
        area.innerHTML = `<span class="error">${I18N.t('network_error')}: ${err.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.textContent = I18N.t('btn_send');
    }
}

function buildPayload(cmdName) {
    const def = CMD_DEFS[cmdName];
    if (!def || def.fields.length === 0) return {};
    if (!def) {
        const raw = document.getElementById('rawJson');
        try { return JSON.parse(raw.value || '{}'); }
        catch (e) { alert(`${I18N.t('invalid_json')}: ${e.message}`); return null; }
    }
    const payload = {};
    for (const f of def.fields) {
        const el = document.getElementById(`f_${f.name}`);
        if (!el) continue;
        let val;
        if (f.type === 'number') val = el.value !== '' ? Number(el.value) : null;
        else if (f.type === 'select') val = el.value || null;
        else if (f.type === 'json') {
            if (el.value.trim() === '') { if (f.required) { alert(`${I18N.t(f.labelKey)} ${I18N.t('field_required')}`); return null; } continue; }
            try { val = JSON.parse(el.value); } catch (e) { alert(`${I18N.t('invalid_json')}: ${e.message}`); return null; }
        } else val = el.value.trim() || null;
        if (val === null || val === '') { if (f.required) { alert(`${I18N.t(f.labelKey)} ${I18N.t('field_required')}`); return null; } continue; }
        payload[f.name] = val;
    }
    return payload;
}

async function fetchAllCommands(ids) {
    for (const id of ids) {
        try {
            const res = await fetch(`${API_BASE}/${id}/commands`);
            if (res.ok) commandsCache[id] = await res.json();
        } catch (_) {}
    }
}

/* ── Messages Tab ───────────────────────────────────── */
function renderMessages() {
    const area = document.getElementById('contentArea');
    if (!selectedCpId) { area.innerHTML = `<div class="no-selection">${I18N.t('select_station_hint')}</div>`; return; }

    area.innerHTML = `
        <div class="panel">
            <h2>${I18N.t('label_messages')}</h2>
            <div class="panel-body">
                <div class="msg-tabs">
                    <button class="msg-tab active" data-msgtab="live" onclick="switchMsgTab('live')">Live</button>
                    <button class="msg-tab" data-msgtab="history" onclick="switchMsgTab('history')">Historie</button>
                </div>
                <div class="filters">
                    <label style="font-size:.78rem;font-weight:600;">${I18N.t('filter_direction')}:</label>
                    <select id="filterDirection">
                        <option value="">${I18N.t('filter_all')}</option>
                        <option value="INBOUND">C→S ${I18N.t('filter_inbound')}</option>
                        <option value="OUTBOUND">S→C ${I18N.t('filter_outbound')}</option>
                    </select>
                    <label style="font-size:.78rem;font-weight:600;">${I18N.t('filter_action')}:</label>
                    <input type="text" id="filterAction" placeholder="z.B. Heartbeat">
                    <button class="btn btn-sm btn-outline" onclick="applyMsgFilters()">${I18N.t('btn_apply')}</button>
                    <div class="status-bar" style="margin-left:auto;">
                        <span id="msgCount">0 ${I18N.t('label_messages_lower')}</span>
                        <span class="live-indicator" id="liveIndicator">
                            <span class="live-dot"></span> ${I18N.t('label_live')}
                        </span>
                    </div>
                </div>
                <div class="message-list" id="messageList"><p class="loading">${I18N.t('loading_messages')}</p></div>
            </div>
        </div>`;

    currentMsgTab = 'live';
    loadMessages();
    msgRefreshTimer = setInterval(() => { if (currentMsgTab === 'live' && selectedCpId) loadMessages(); }, 3000);
}

function switchMsgTab(tab) {
    currentMsgTab = tab;
    document.querySelectorAll('.msg-tab').forEach(t => t.classList.toggle('active', t.dataset.msgtab === tab));
    document.getElementById('liveIndicator').style.display = tab === 'live' ? 'inline-flex' : 'none';
    loadMessages();
}

function applyMsgFilters() { loadMessages(); }

async function loadMessages() {
    if (!selectedCpId) return;
    const list = document.getElementById('messageList');
    const direction = document.getElementById('filterDirection')?.value || '';
    const action = document.getElementById('filterAction')?.value || '';
    try {
        let url = `/api/chargepoints/${encodeURIComponent(selectedCpId)}/messages${currentMsgTab === 'history' ? '/history' : ''}?limit=200`;
        if (direction) url += `&direction=${encodeURIComponent(direction)}`;
        if (action) url += `&action=${encodeURIComponent(action)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const messages = currentMsgTab === 'history' && data.messages ? data.messages : data;
        renderMessagesList(messages);
    } catch (err) {
        list.innerHTML = `<p class="error">${I18N.t('error_loading')}: ${err.message}</p>`;
    }
}

function renderMessagesList(messages) {
    const list = document.getElementById('messageList');
    const countEl = document.getElementById('msgCount');
    if (messages.length === 0) {
        list.innerHTML = `<p class="empty">${I18N.t('no_messages')}</p>`;
        if (countEl) countEl.textContent = `0 ${I18N.t('label_messages_lower')}`;
        return;
    }
    const loc = getDateLocale();
    list.innerHTML = messages.map(msg => {
        const dirCls = msg.direction === 'INBOUND' ? 'inbound' : 'outbound';
        const dirLabel = msg.direction === 'INBOUND' ? 'C→S' : 'S→C';
        const timeStr = new Date(msg.timestamp).toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        const payloadPreview = msg.payload ? (msg.payload.length > 300 ? msg.payload.substring(0, 300) + '…' : msg.payload) : '–';
        return `<div class="message-item">
            <span class="msg-direction ${dirCls}">${dirLabel}</span>
            <span class="msg-type">${msg.messageType}</span>
            <span class="msg-action">${msg.action || '–'}</span>
            <span class="msg-payload" title="${escapeAttr(msg.payload || '')}">${escapeHtml(payloadPreview)}</span>
            <span class="msg-time">${timeStr}</span>
        </div>`;
    }).join('');
    if (countEl) countEl.textContent = `${messages.length} ${I18N.t('label_messages_lower')}`;
}

/* ── Init ───────────────────────────────────────────── */
document.addEventListener('langchange', () => {
    renderSidebar();
    if (selectedCpId) renderActiveTab();
});

(async () => {
    await loadStations();
    const params = new URLSearchParams(window.location.search);
    const cpFromUrl = params.get('cp');
    const tabFromHash = window.location.hash.slice(1);
    if (tabFromHash && ['overview', 'commands', 'messages'].includes(tabFromHash)) {
        activeTab = tabFromHash;
        document.querySelectorAll('#tabBar .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    }
    if (cpFromUrl) {
        selectStation(cpFromUrl);
    }
})();
</script>
</body>
</html>
