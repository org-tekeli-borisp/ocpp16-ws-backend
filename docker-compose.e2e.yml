services:
  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    restart: "no"
    ports:
      - "8081:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ocpp
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "sleep 5 && exec /opt/jboss/container/java/run/run-java.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_DB: ocpp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocpp"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
