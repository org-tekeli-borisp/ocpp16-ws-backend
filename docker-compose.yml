services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocpp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-src/main/docker/Dockerfile.jvm}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${APP_SSL_PORT:-8443}:8443"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ocpp}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      QUARKUS_HTTP_SSL_CERTIFICATE_FILE: ${QUARKUS_HTTP_SSL_CERTIFICATE_FILE:-/certs/server.crt}
      QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILE: ${QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILE:-/certs/server.key}
      QUARKUS_HTTP_SSL_CLIENT_CERT: ${QUARKUS_HTTP_SSL_CLIENT_CERT:-REQUEST}
      QUARKUS_HTTP_SSL_PORT: ${QUARKUS_HTTP_SSL_PORT:-8443}
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
